name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  tokens:
    name: Tokens and Swift packages
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends python3 libgtk-4-dev libxml2-utils
      - run: python3 -m py_compile tools/*.py
      - run: python3 tools/tokens.py --check
      - run: python3 tools/xaml_check.py
      - run: python3 tools/states_check.py
      - run: swift test
      - run: swift build --product GabaritGtk
      - run: swift build
        working-directory: galerie/gtk
      - run: xmllint --noout swift/GabaritWinUI/Resources/*.xaml

  android:
    name: Android library and its gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew :gabarit:assembleRelease :gabarit:testDebugUnitTest --no-daemon
        working-directory: android

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
