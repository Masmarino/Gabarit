version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    target-branch: v3
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'

  - package-ecosystem: github-actions
    directory: /
    target-branch: v3
    schedule:
      interval: weekly
