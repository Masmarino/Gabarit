@if (label(); as text) {
  <span class="gbt-secret-reveal__label" [id]="labelId">{{ text }}</span>
}
<div
  class="gbt-secret-reveal__box"
  [attr.role]="label() ? 'group' : null"
  [attr.aria-labelledby]="label() ? labelId : null"
>
  <!-- prettier-ignore -->
  <code #code class="gbt-secret-reveal__value" [id]="valueId">@if (revealed()) {{{ value() }}} @else {<span aria-hidden="true">{{ mask() }}</span><span class="sr-only">{{ hiddenLabel() }}</span>}</code>
  <gbt-button
    class="gbt-secret-reveal__toggle"
    variant="secondary"
    size="small"
    [iconOnly]="true"
    [iconName]="revealed() ? 'eye-off' : 'eye'"
    [ariaLabel]="revealed() ? hideLabel() : showLabel()"
    [ariaControls]="valueId"
    (clicked)="toggle()"
  />
  <gbt-copy-button
    class="gbt-secret-reveal__copy"
    [value]="value()"
    [ariaLabel]="copyLabel()"
    [copiedText]="copiedText()"
    [failedText]="failedText()"
    [feedbackMs]="feedbackMs()"
    [feedback]="feedback()"
    (copied)="copied.emit($event)"
    (copyFailed)="onCopyFailed()"
  />
</div>
