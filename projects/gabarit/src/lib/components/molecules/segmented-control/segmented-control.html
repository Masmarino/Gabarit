@if (label()) {
  <span [id]="labelId" class="gbt-segmented-control__label">{{ label() }}</span>
}
<div
  #group
  class="gbt-segmented-control"
  [class.gbt-segmented-control--sm]="size() === 'sm'"
  [class.gbt-segmented-control--wrap]="wrap()"
  [class.gbt-segmented-control--tinted]="tinted()"
  role="radiogroup"
  [attr.aria-label]="label() ? null : ariaLabel() || null"
  [attr.aria-labelledby]="label() ? labelId : null"
>
  @for (option of options(); track option.value; let i = $index) {
    <button
      type="button"
      role="radio"
      class="gbt-segmented-control__option"
      [class.gbt-segmented-control__option--selected]="isSelected(option.value)"
      [attr.aria-checked]="isSelected(option.value)"
      [tabIndex]="isSelected(option.value) ? 0 : -1"
      [disabled]="disabled() || !!option.disabled"
      (click)="select(option)"
      (keydown)="onKeydown($event, i)"
    >
      {{ option.label }}
    </button>
  }
</div>
