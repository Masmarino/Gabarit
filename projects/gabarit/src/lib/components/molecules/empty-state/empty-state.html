<div class="gbt-empty-state">
  <div class="gbt-empty-state__illustration" aria-hidden="true">
    @switch (illustration()) {
      @case ('folder') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="16" y="38" width="64" height="40" rx="4" />
          <path d="M16 38 v-8a4 4 0 0 1 4-4h16l8 8h28a4 4 0 0 1 4 4" />
          <rect x="34" y="14" width="16" height="20" rx="2" transform="rotate(-8 42 24)" opacity="0.55" />
          <rect x="50" y="16" width="16" height="20" rx="2" transform="rotate(6 58 26)" opacity="0.55" />
        </svg>
      }
      @case ('star') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M48,18 L55.6,37.5 L76.5,38.7 L60.4,52 L65.6,72.3 L48,61 L30.4,72.3 L35.6,52 L19.5,38.7 L40.4,37.5 Z" />
          <path d="M78,14 L81,20 L78,26 L75,20 Z" opacity="0.55" />
          <path d="M16,64 L19,70 L16,76 L13,70 Z" opacity="0.55" />
        </svg>
      }
      @case ('checklist') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="24" y="18" width="48" height="64" rx="6" />
          <rect x="38" y="12" width="20" height="10" rx="3" />
          <line x1="34" y1="38" x2="62" y2="38" />
          <path d="M32 50 l4 4 l8-8" />
          <line x1="46" y1="52" x2="62" y2="52" />
          <line x1="34" y1="66" x2="62" y2="66" opacity="0.55" />
        </svg>
      }
      @case ('merge') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="22" r="7" />
          <circle cx="72" cy="22" r="7" />
          <circle cx="48" cy="76" r="8" />
          <path d="M24 29 V50 Q24 69 39 72" />
          <path d="M72 29 V50 Q72 69 57 72" />
        </svg>
      }
      @case ('pipeline') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="22" cy="68" r="12" />
          <path d="M17 60 L29 68 L17 76 Z" fill="currentColor" stroke="none" />
          <path d="M29 58 L44 38" />
          <circle cx="50" cy="30" r="10" />
          <path d="M56 38 L70 54" />
          <circle cx="76" cy="62" r="10" />
        </svg>
      }
      @case ('tag') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20 H54 L82 48 L54 76 H18 Q14 76 14 72 V24 Q14 20 18 20 Z" />
          <circle cx="34" cy="36" r="5" />
        </svg>
      }
      @case ('book') {
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M48 26 Q34 16 16 20 V72 Q34 68 48 78 Q62 68 80 72 V20 Q62 16 48 26 Z" />
          <line x1="24" y1="32" x2="40" y2="30" />
          <line x1="24" y1="42" x2="40" y2="40" />
          <line x1="56" y1="30" x2="72" y2="32" />
          <line x1="56" y1="40" x2="72" y2="42" />
        </svg>
      }
    }
  </div>
  <p class="gbt-empty-state__heading">{{ heading() }}</p>
  @if (message()) {
    <p class="gbt-empty-state__message">{{ message() }}</p>
  }
  <div class="gbt-empty-state__action">
    <ng-content />
  </div>
</div>
