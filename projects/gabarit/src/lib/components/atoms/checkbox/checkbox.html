<label class="gbt-checkbox" [class.gbt-checkbox--disabled]="isDisabled()">
  <input
    type="checkbox"
    [id]="id()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-describedby]="hint() ? hintId() : null"
    (change)="onToggle($event)"
  />
  <span>{{ label() }}</span>
</label>
@if (hint()) {
  <p [id]="hintId()" class="gbt-checkbox__hint">{{ hint() }}</p>
}
