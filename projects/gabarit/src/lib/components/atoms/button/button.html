@if (isAnchor) {
  @if (iconName()) {
    <gbt-icon [name]="iconName()!" aria-hidden="true" />
  }
  <ng-content />
} @else {
  <button
    [type]="type()"
    class="gbt-button gbt-button--{{ variant() }} gbt-button--{{ size() }}"
    [class.gbt-button--icon-only]="iconOnly()"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-busy]="loading() ? 'true' : null"
    [attr.aria-pressed]="pressed()"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-controls]="ariaControls()"
    [attr.aria-haspopup]="ariaHaspopup()"
    (click)="handleClick()"
  >
    @if (iconName()) {
      <gbt-icon [name]="iconName()!" aria-hidden="true" />
    }
    @if (loading()) {
      <span class="gbt-button__spinner" aria-hidden="true"></span>
      <span class="sr-only">{{ loadingLabel() }}</span>
    }
    @if (text()) {
      <span>{{ text() }}</span>
    }
  </button>
}
