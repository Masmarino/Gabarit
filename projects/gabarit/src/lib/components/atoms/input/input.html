<div
  class="gbt-input"
  [class.gbt-input--sm]="size() === 'sm'"
  [class.gbt-input--mono]="mono()"
  [class.gbt-input--leading]="!!leadingIcon()"
>
  @if (label()) {
    <label [for]="id()" [class.gbt-input__label--hidden]="hideLabel()"
      >{{ label() }}{{ required() ? ' *' : '' }}</label
    >
  }
  <div class="gbt-input__wrapper">
    @if (leadingIcon(); as icon) {
      <span class="gbt-input__leading" aria-hidden="true">
        <gbt-icon [name]="icon" />
      </span>
    }
    <input
      [id]="id()"
      [type]="effectiveType()"
      [placeholder]="placeholder()"
      [required]="required()"
      [disabled]="isDisabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode()"
      [attr.spellcheck]="spellcheck()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.enterkeyhint]="enterkeyhint()"
      [attr.maxlength]="maxlength()"
      [attr.min]="min()"
      [attr.max]="max()"
      [value]="value()"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    @if (type() === 'password') {
      <button
        type="button"
        class="gbt-input__toggle"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="passwordVisible() ? hidePasswordLabel() : showPasswordLabel()"
      >
        <gbt-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" aria-hidden="true" />
      </button>
    }
  </div>
  @if (showHint()) {
    <p [id]="hintId()" class="gbt-input__hint">{{ hint() }}</p>
  }
  @if (errorMessage()) {
    <p [id]="errorId()" class="gbt-input__error" role="alert">{{ errorMessage() }}</p>
  }
</div>
