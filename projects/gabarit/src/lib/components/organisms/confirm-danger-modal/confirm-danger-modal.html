<gbt-modal
  [isOpen]="isOpen()"
  [heading]="heading()"
  [closeLabel]="closeLabel()"
  [busy]="busy()"
  [busyLabel]="busyLabel()"
  (closed)="cancel()"
>
  @if (requiresTyping()) {
    <p class="gbt-confirm-danger-modal__message">{{ message() }}</p>
    <gbt-input
      [label]="confirmInputLabel()"
      [disabled]="busy()"
      [ngModel]="typed()"
      (ngModelChange)="typed.set($event)"
    />
  } @else {
    <div class="gbt-confirm-danger-modal__summary" [attr.data-tone]="tone()">
      <span class="gbt-confirm-danger-modal__icon" aria-hidden="true">
        <gbt-icon [name]="toneIcon()" />
      </span>
      <p class="gbt-confirm-danger-modal__message">{{ message() }}</p>
    </div>
  }
  <div class="gbt-confirm-danger-modal__actions">
    <gbt-button
      variant="secondary"
      [text]="cancelLabel()"
      [disabled]="busy()"
      (clicked)="cancel()"
    />
    <gbt-button
      [variant]="confirmVariant()"
      [text]="confirmLabel()"
      [iconName]="confirmIcon()"
      [disabled]="!canConfirm()"
      [loading]="busy()"
      [loadingLabel]="busyLabel()"
      (clicked)="confirm()"
    />
  </div>
</gbt-modal>
