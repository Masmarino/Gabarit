<ul class="gbt-chart-legend">
  @for (entry of entries(); track $index) {
    <li
      class="gbt-chart-legend__item"
      [class.gbt-chart-legend__item--active]="interactive() && activeIndex() === $index"
      [attr.data-pattern]="entry.pattern ?? 'solid'"
      [attr.tabindex]="interactive() ? 0 : null"
      (mouseenter)="interactive() && activeIndexChange.emit($index)"
      (mouseleave)="interactive() && onMouseLeave($event)"
      (focus)="interactive() && activeIndexChange.emit($index)"
      (blur)="interactive() && activeIndexChange.emit(null)"
    >
      <svg class="gbt-chart-legend__swatch" viewBox="0 0 24 8" aria-hidden="true" focusable="false">
        @if (entry.color; as color) {
          <rect class="gbt-chart-legend__fill" x="4" y="0" width="8" height="8" rx="2" [attr.fill]="color" />
        } @else {
          <line
            class="gbt-chart-legend__line"
            x1="0"
            y1="4"
            x2="24"
            y2="4"
            [attr.stroke-dasharray]="dashArray(entry.pattern)"
            stroke-width="2"
          />
        }
      </svg>
      {{ entry.label }}
      @if (entry.value; as value) {
        <span class="gbt-chart-legend__value">{{ value }}</span>
      }
    </li>
  }
</ul>
