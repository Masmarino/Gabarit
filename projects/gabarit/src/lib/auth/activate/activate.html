<gbt-auth-panel
  [heading]="view() === 'form' ? text().heading : ''"
  [intro]="view() === 'form' ? intro() : ''"
>
  <ng-container ngProjectAs="[auth-logo]"><ng-content select="[auth-logo]" /></ng-container>

  @switch (view()) {
    @case ('form') {
      <form class="gbt-auth-panel__form" (ngSubmit)="submit()" novalidate>
        @if (error()) {
          <gbt-alert variant="error" appearance="subtle" iconAlign="start">{{ error() }}</gbt-alert>
        }

        @if (chooseUsername()) {
          <gbt-input
            [id]="id + '-username'"
            name="username"
            autocomplete="username"
            [label]="text().username"
            [hint]="text().usernameHint"
            [errorMessage]="usernameFieldError()"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
          />
        }

        <gbt-input
          [id]="id + '-password'"
          type="password"
          name="password"
          autocomplete="new-password"
          [label]="text().password"
          [showPasswordLabel]="text().showPassword"
          [hidePasswordLabel]="text().hidePassword"
          [hint]="passwordHint()"
          [errorMessage]="passwordFieldError()"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />

        <gbt-input
          [id]="id + '-confirmation'"
          type="password"
          name="confirmation"
          autocomplete="new-password"
          [label]="text().confirmation"
          [showPasswordLabel]="text().showPassword"
          [hidePasswordLabel]="text().hidePassword"
          [errorMessage]="confirmationFieldError()"
          [ngModel]="confirmation()"
          (ngModelChange)="confirmation.set($event)"
        />

        <gbt-button
          class="gbt-auth-panel__submit"
          block
          type="submit"
          size="large"
          [text]="text().submit"
          [loading]="submitting()"
          [loadingLabel]="text().submitting"
        />
      </form>

      @if (signInLink()) {
        <gbt-auth-footer [text]="text().signInPrompt"
          ><ng-content select="[gbtAuthFooterLink]"
        /></gbt-auth-footer>
      }
    }
    @case ('success') {
      <gbt-empty-state
        class="gbt-auth-panel__status gbt-auth-panel__status--success"
        icon="circle-check"
        [headingLevel]="1"
        headingFocusable
        [heading]="text().successHeading"
        [message]="text().successMessage"
      >
        <gbt-button
          class="gbt-auth-panel__submit"
          block
          size="large"
          [text]="text().signIn"
          (clicked)="signIn.emit()"
        />
      </gbt-empty-state>
    }
    @case ('invalid') {
      <gbt-empty-state
        class="gbt-auth-panel__status"
        tone="error"
        icon="shield-alert"
        [headingLevel]="1"
        headingFocusable
        [heading]="text().invalidHeading"
        [message]="text().invalidMessage"
      >
        <gbt-button
          class="gbt-auth-panel__submit"
          block
          size="large"
          [text]="text().signIn"
          (clicked)="signIn.emit()"
        />
      </gbt-empty-state>
    }
  }
</gbt-auth-panel>
