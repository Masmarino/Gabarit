<div class="gbt-sr-only">
  <table>
    <caption>
      {{
        caption()
      }}
    </caption>
    <thead>
      <tr>
        @for (column of columns(); track column) {
          <th scope="col">{{ column }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          @for (cell of row; track $index) {
            <td>{{ cell }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
