<div class="gbt-tabs">
  <div #list class="gbt-tabs__list" [class.gbt-tabs__list--lens]="!!lens()" role="tablist">
    @if (lens(); as box) {
      <span
        class="gbt-tabs__lens"
        [class.gbt-tabs__lens--glides]="lensGlides()"
        aria-hidden="true"
        [style.width.px]="box.width"
        [style.height.px]="box.height"
        [style.transform]="'translate(' + box.x + 'px, ' + box.y + 'px)'"
      ></span>
    }
    @for (tab of tabs(); track tab; let i = $index) {
      <button
        #trigger
        type="button"
        class="gbt-tabs__trigger"
        [class.gbt-tabs__trigger--active]="activeIndex() === i"
        role="tab"
        [id]="id() + '-trigger-' + i"
        [attr.aria-selected]="activeIndex() === i"
        [attr.aria-controls]="id() + '-panel-' + i"
        [tabIndex]="activeIndex() === i ? 0 : -1"
        (click)="select(i)"
        (keydown)="onKeydown($event, i)"
      >
        {{ tab.label() }}
      </button>
    }
  </div>
  <div class="gbt-tabs__panels">
    <ng-content></ng-content>
  </div>
</div>
