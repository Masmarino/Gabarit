<header class="gbt-page-header">
  <div class="gbt-page-header__main">
    <div class="gbt-page-header__title-row">
      @switch (headingLevel()) {
        @case (2) {
          <h2 class="gbt-page-header__title">{{ heading() }}</h2>
        }
        @case (3) {
          <h3 class="gbt-page-header__title">{{ heading() }}</h3>
        }
        @default {
          <h1 class="gbt-page-header__title">{{ heading() }}</h1>
        }
      }
      <ng-content select="[header-title]" />
      <div class="gbt-page-header__badges"><ng-content select="[header-badges]" /></div>
    </div>
    <div class="gbt-page-header__meta"><ng-content select="[header-meta]" /></div>
  </div>
  <div class="gbt-page-header__actions"><ng-content select="[header-actions]" /></div>
</header>
