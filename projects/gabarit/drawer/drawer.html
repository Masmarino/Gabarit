@if (rendered()) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div
    class="gbt-drawer__backdrop"
    [class.gbt-drawer__backdrop--closing]="!isOpen()"
    (click)="onBackdropClick($event)"
  >
    <div
      #panel
      class="gbt-drawer__panel"
      [class.gbt-drawer__panel--closing]="!isOpen()"
      [attr.data-edge]="edge()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="heading() || null"
      tabindex="-1"
      (keydown)="onPanelKeydown($event)"
    >
      <header class="gbt-drawer__header">
        @switch (headingLevel()) {
          @case (1) {
            <h1 class="gbt-drawer__title">{{ heading() }}</h1>
          }
          @case (3) {
            <h3 class="gbt-drawer__title">{{ heading() }}</h3>
          }
          @case (4) {
            <h4 class="gbt-drawer__title">{{ heading() }}</h4>
          }
          @case (5) {
            <h5 class="gbt-drawer__title">{{ heading() }}</h5>
          }
          @case (6) {
            <h6 class="gbt-drawer__title">{{ heading() }}</h6>
          }
          @default {
            <h2 class="gbt-drawer__title">{{ heading() }}</h2>
          }
        }
        <button
          type="button"
          class="gbt-drawer__close"
          (click)="closed.emit()"
          [attr.aria-label]="closeLabel()"
        >
          <gbt-icon name="x" aria-hidden="true" />
        </button>
      </header>
      <div class="gbt-drawer__body">
        <ng-content />
      </div>
    </div>
  </div>
}
